name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: CI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Check packed Bun and Node consumers
        run: bun run check:package "$RUNNER_TEMP/npm-package"
      - name: Preview release without writes or publication
        if: matrix.node == '24'
        run: bun run scripts/release.ts "$RUNNER_TEMP/npm-package" --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save tested release tarball
        if: matrix.node == '24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Release and publish
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Create release, then publish the tested tarball
        run: bun run scripts/release.ts "$RUNNER_TEMP/npm-package"
        env:
          GH_TOKEN: ${{ github.token }}
          # Prefer npm OIDC trusted publishing for this release.yml workflow.
          # Optional bootstrap secret: granular token with publish + bypass-2FA.
          # Remove NPM_TOKEN after trusted publishing is configured and verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
